[build_settings]
language_standard = "C++17"
stdlib = "libc++"
architectures = ["arm64", "x86_64"]
deployment_target = "12.0"

[build_settings.frameworks]
required = [
    "AudioToolbox",
    "AVFoundation",
    "CoreAudio",
    "SwiftUI",
    "Combine"
]

[build_settings.header_search_paths]
paths = [
    "$(PROJECT_DIR)/../src/dsp_core",
    "$(PROJECT_DIR)/../src/esp32_port",
    "$(PROJECT_DIR)/../src/au_wrapper"
]

[audio_unit]
type = "aumi"
subtype = "mdla"
manufacturer = "Cbnd"
name = "Modal Attractors"
description = "Physical modeling synthesizer using coupled modal oscillators"
version = "1.0.0"

[notes]
usage = "This template provides a complete AUv3 Audio Unit implementation. To use: 1) Copy to your project directory, 2) Add DSP source files from src/, 3) Configure code signing, 4) Build and test"
integration = "Integrates with Modal Attractors DSP engine (src/dsp_core, src/esp32_port, src/au_wrapper)"
