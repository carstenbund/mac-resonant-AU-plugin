# Xcode Project Template Configuration
# This file tracks the structure and files of the Modal Attractors Xcode project template

[project]
name = "ModalAttractors"
version = "1.0.0"
description = "Audio Unit v3 (AUv3) plugin template for Modal Attractors synthesizer"
language = "Swift"
platform = "macOS"
min_deployment_target = "12.0"

[project.identifiers]
bundle_id_base = "com.carstenbund.audiounit"
app_bundle_id = "com.carstenbund.audiounit.ModalAttractors"
extension_bundle_id = "com.carstenbund.audiounit.ModalAttractorsExtension"

[project.targets]
host_app = "ModalAttractors"
au_extension = "ModalAttractorsExtension"

# Xcode project files
[[files]]
path = "xcode-project/ModalAttractors.xcodeproj/project.pbxproj"
type = "xcode_project"
description = "Main Xcode project configuration file"

[[files]]
path = "xcode-project/ModalAttractors.xcodeproj/project.xcworkspace/contents.xcworkspacedata"
type = "xcode_workspace"
description = "Xcode workspace metadata"

# Host Application files
[[files]]
path = "xcode-project/ModalAttractors/ModalAttractorsApp.swift"
type = "swift_source"
target = "ModalAttractors"
description = "Main SwiftUI app entry point for host application"

[[files]]
path = "xcode-project/ModalAttractors/ContentView.swift"
type = "swift_source"
target = "ModalAttractors"
description = "Main SwiftUI view for host application"

[[files]]
path = "xcode-project/ModalAttractors/ModalAttractors.entitlements"
type = "entitlements"
target = "ModalAttractors"
description = "App entitlements and sandboxing configuration"

# Host Application - Model
[[files]]
