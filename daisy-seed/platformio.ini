; PlatformIO Project Configuration File
;
; Daisy Seed Modal Resonator
; Port of ESP32 distributed modal resonator network
;
; Build profiles:
; - daisy_seed: Standard build with optimizations
; - daisy_seed_debug: Debug build with serial output
;
; Build: pio run
; Upload: pio run --target upload
; Monitor: pio device monitor

[platformio]
default_envs = daisy_seed

[env]
platform = ststm32
framework = arduino
board = daisy_seed

; Common build flags
build_flags =
    ; Audio configuration
    -D SAMPLE_RATE=48000
    -D AUDIO_BLOCK_SIZE=48
    -D CONTROL_RATE_HZ=500

    ; ARM optimization flags
    -O2                          ; Optimize for speed
    -mfpu=fpv5-d16              ; Hardware FPU (double precision)
    -mfloat-abi=hard            ; Use hardware floating point
    -ffast-math                  ; Fast math operations
    -funroll-loops              ; Loop unrolling

    ; Code size optimization
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

    ; Warnings
    -Wall
    -Wextra
    -Wno-unused-parameter

; Common libraries
lib_deps =
    https://github.com/electro-smith/libDaisy.git
    https://github.com/electro-smith/DaisySP.git

; Upload configuration
upload_protocol = dfu
upload_command = dfu-util -a 0 -s 0x08000000:leave -D $SOURCE

; Serial monitor
monitor_speed = 115200

; ============================================================================
; Production Build (Optimized)
; ============================================================================

[env:daisy_seed]
build_flags =
    ${env.build_flags}
    -D RELEASE_BUILD

; ============================================================================
; Debug Build (Serial Output, Assertions)
; ============================================================================

[env:daisy_seed_debug]
build_type = debug
build_flags =
    ${env.build_flags}
    -D DEBUG
    -D DEBUG_AUDIO
    -g                          ; Debug symbols
    -Og                         ; Optimize for debugging

; ============================================================================
; Performance Profiling Build
; ============================================================================

[env:daisy_seed_profile]
build_flags =
    ${env.build_flags}
    -D PROFILE_CPU
    -pg                         ; Enable profiling

; ============================================================================
; Automated Test Suite (runs test scenarios)
; ============================================================================

[env:daisy_seed_test]
build_flags =
    ${env.build_flags}
    -D TEST_MODE
    -D DAISY_SEED
build_src_filter =
    +<*>
    -<main.cpp>
    +<test/main_test.cpp>
    +<test/test_scenarios.cpp>

; Enable serial logging for test results
monitor_speed = 115200
